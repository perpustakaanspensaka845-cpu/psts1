<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Penilaian Sumatif Tengah Semester</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- PapaParse untuk membaca data Google Sheets -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    body {
      background-color: #f4f6f9;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    
    /* Header Banner Biru */
    .header-banner {
      background-color: #0d6efd;
      color: white;
      border-radius: 16px;
      padding: 30px 20px;
      text-align: center;
      margin-bottom: 25px;
      box-shadow: 0 4px 15px rgba(13, 110, 253, 0.2);
    }
    .school-logo {
      max-height: 70px;
      background: white;
      padding: 6px;
      border-radius: 10px;
      margin-bottom: 15px;
    }
    .header-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .school-name {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 2px;
    }
    .academic-year {
      font-size: 0.85rem;
      font-weight: 700;
      color: #ffda6a;
      text-transform: uppercase;
    }

    /* Form Container Card */
    .form-card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      max-width: 520px;
      margin: 0 auto 20px auto;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }
    .form-card-title {
      color: #0d6efd;
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 18px;
    }
    .form-label {
      font-size: 0.88rem;
      font-weight: 600;
      color: #495057;
      margin-bottom: 6px;
    }
    .form-select {
      border-radius: 8px;
      font-size: 0.95rem;
      padding: 10px 14px;
      border-color: #ced4da;
    }

    /* Result Card (Mata Pelajaran & Tombol) */
    .result-card {
      background: white;
      border: 1.5px solid #b6d4fe;
      border-radius: 16px;
      padding: 24px;
      max-width: 520px;
      margin: 0 auto;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
    }
    .result-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: #6c757d;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .subject-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: #212529;
      margin-bottom: 18px;
    }
    .btn-exam {
      background-color: #0d6efd;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-weight: 700;
      font-size: 1rem;
      transition: all 0.2s ease;
    }
    .btn-exam:hover {
      background-color: #0b5ed7;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <div class="container py-4">
    <!-- 1. Header Banner -->
    <div class="header-banner">
      <img id="logoSekolah" src="" alt="Logo" class="school-logo d-none mx-auto">
      <div class="header-title" id="judulHalaman">PORTAL PENILAIAN SUMATIF TENGAH SEMESTER</div>
      <div class="school-name" id="namaSekolah">SMP NEGERI 1 KANDAT</div>
      <div class="academic-year" id="tahunAjaran">SEMESTER 1 TAHUN AJARAN 2026/2027</div>
    </div>

    <!-- Indicator Loading -->
    <div id="loading" class="text-center py-4">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-2 text-muted fw-semibold">Memuat data jadwal...</p>
    </div>

    <!-- Main Content (Awalnya Tersembunyi) -->
    <div id="mainContent" class="d-none">
      
      <!-- 2. Form Card Choice -->
      <div class="form-card">
        <div class="form-card-title">Pilih Jadwal & Kelas</div>
        
        <!-- Dropdown Hari -->
        <div class="mb-3">
          <label class="form-label">1. Pilih Hari</label>
          <select id="selectHari" class="form-select" onchange="updateView()">
            <option value="">-- Pilih Hari --</option>
          </select>
        </div>

        <!-- Dropdown Kelas -->
        <div class="mb-3">
          <label class="form-label">2. Pilih Kelas</label>
          <select id="selectKelas" class="form-select" onchange="updateView()">
            <option value="">-- Pilih Kelas --</option>
          </select>
        </div>

        <!-- Dropdown Jam -->
        <div class="mb-1">
          <label class="form-label">3. Pilih Jam Ke-</label>
          <select id="selectJam" class="form-select" onchange="updateView()">
            <option value="1">Jam Ke-1</option>
            <option value="2">Jam Ke-2</option>
          </select>
        </div>
      </div>

      <!-- 3. Result Container -->
      <div id="resultContainer"></div>

    </div>
  </div>

  <script>
    const SPREADSHEET_ID = '1HH-8ikCLW2fHHtYZqT1k9ZfPBJcmgQRp0ag0nH7LCGQ';

    let rawUjianRows = [];
    let classHeaders = []; // Menyimpan daftar kelas dari kolom ke-3 dst.

    // Fungsi Fetch CSV dari Google Spreadsheet
    async function fetchCSV(sheetName) {
      const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
      const response = await fetch(url);
      if (!response.ok) throw new Error('Gagal mengambil data');
      const text = await response.text();
      return Papa.parse(text, { header: false, skipEmptyLines: true }).data;
    }

    async function initApp() {
      try {
        // 1. Ambil Pengaturan
        const configData = await fetchCSV('Pengaturan');
        const config = {};
        configData.forEach(row => {
          if (row[0]) config[row[0].trim()] = row[1] ? row[1].trim() : '';
        });

        if (config.NAMA_SEKOLAH) document.getElementById('namaSekolah').innerText = config.NAMA_SEKOLAH;
        if (config.JUDUL_HALAMAN) document.getElementById('judulHalaman').innerText = config.JUDUL_HALAMAN;
        if (config.TAHUN_AJARAN) document.getElementById('tahunAjaran').innerText = config.TAHUN_AJARAN;
        if (config.LOGO_URL) {
          const logo = document.getElementById('logoSekolah');
          logo.src = config.LOGO_URL;
          logo.classList.remove('d-none');
        }

        // 2. Ambil Data Ujian
        const ujianData = await fetchCSV('Data_Ujian');
        if (ujianData.length > 0) {
          const headerRow = ujianData[0];
          
          // Ambil nama kelas dari kolom index 3 ke atas
          classHeaders = [];
          for (let i = 3; i < headerRow.length; i++) {
            const cName = headerRow[i] ? headerRow[i].trim() : '';
            if (cName && cName !== '-') {
              classHeaders.push({ index: i, name: cName });
            }
          }

          rawUjianRows = ujianData.slice(1);

          // Populate Select Hari (Unik)
          const hariList = [];
          rawUjianRows.forEach(row => {
            const h = row[0] ? row[0].trim() : '';
            if (h && !hariList.includes(h)) hariList.push(h);
          });

          const selectHari = document.getElementById('selectHari');
          selectHari.innerHTML = '';
          hariList.forEach(h => {
            const opt = document.createElement('option');
            opt.value = h;
            opt.innerText = h;
            selectHari.appendChild(opt);
          });

          // Populate Select Kelas
          const selectKelas = document.getElementById('selectKelas');
          selectKelas.innerHTML = '';
          classHeaders.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c.index;
            opt.innerText = c.name;
            selectKelas.appendChild(opt);
          });

          // Default Pilihan Awal
          if (hariList.length > 0) selectHari.value = hariList[0];
          if (classHeaders.length > 1) selectKelas.value = classHeaders[1].index; // Misal pilih 7(DEF)
        }

        document.getElementById('loading').classList.add('d-none');
        document.getElementById('mainContent').classList.remove('d-none');

        updateView();

      } catch (err) {
        console.error(err);
        alert('Gagal memuat data. Pastikan spreadsheet disetting "Siapa saja yang memiliki link" (Pelihat)!');
      }
    }

    function updateView() {
      const selectedHari = document.getElementById('selectHari').value;
      const selectedKelasIdx = parseInt(document.getElementById('selectKelas').value);
      const selectedJam = document.getElementById('selectJam').value;
      const resultContainer = document.getElementById('resultContainer');

      if (!selectedHari || isNaN(selectedKelasIdx)) {
        resultContainer.innerHTML = '';
        return;
      }

      // Filter baris berdasarkan Hari dan Jam
      const matchingRows = rawUjianRows.filter(row => {
        const h = row[0] ? row[0].trim() : '';
        const j = row[1] ? row[1].trim() : '';
        return h === selectedHari && j === selectedJam;
      });

      let cardsHtml = '';

      matchingRows.forEach(row => {
        const mapel = row[2] ? row[2].trim() : 'Mata Pelajaran';
        const link = row[selectedKelasIdx] ? row[selectedKelasIdx].trim() : '';

        if (link && link.startsWith('http')) {
          cardsHtml += `
            <div class="result-card mb-3">
              <div class="result-label">MATA PELAJARAN</div>
              <div class="subject-title">${mapel}</div>
              <a href="${link}" target="_blank" class="btn btn-primary btn-exam w-100">
                🚀 Buka Ujian Sekarang
              </a>
            </div>
          `;
        }
      });

      if (cardsHtml === '') {
        cardsHtml = `
          <div class="result-card">
            <div class="result-label">MATA PELAJARAN</div>
            <div class="subject-title text-muted" style="font-size: 1.1rem;">Belum Ada Jadwal / Link Ujian</div>
            <button class="btn btn-secondary btn-exam w-100" disabled>Ujian Tidak Tersedia</button>
          </div>
        `;
      }

      resultContainer.innerHTML = cardsHtml;
    }

    window.onload = initApp;
  </script>
</body>
</html>
