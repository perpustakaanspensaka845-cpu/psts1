<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal PSTS Online</title>
  <!-- Bootstrap 5 CSS & FontAwesome Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- PapaParse Library untuk Parsing CSV -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  
  <style>
    body {
      background-color: #f0f2f5;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .header-card {
      background: linear-gradient(135deg, #0d6efd, #0a58ca);
      color: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 8px 20px rgba(13, 110, 253, 0.15);
    }
    .school-logo {
      max-height: 80px;
      background: white;
      padding: 6px;
      border-radius: 12px;
      object-fit: contain;
    }
    .main-card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    .btn-exam {
      font-weight: 600;
      border-radius: 8px;
    }
    .badge-day {
      font-size: 0.85rem;
      padding: 6px 12px;
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <div class="container py-4">
    <!-- Header Identitas Sekolah -->
    <div class="header-card d-flex align-items-center justify-content-between flex-wrap gap-3">
      <div class="d-flex align-items-center gap-3">
        <img id="logoSekolah" src="" alt="Logo" class="school-logo d-none">
        <div>
          <h3 id="namaSekolah" class="fw-bold mb-1">Memuat data...</h3>
          <h5 id="judulHalaman" class="fw-normal mb-1 text-white-50">Portal Penilaian Sumatif</h5>
          <span id="tahunAjaran" class="badge bg-white text-primary fw-semibold mt-1"></span>
        </div>
      </div>
      <button class="btn btn-light text-primary fw-bold rounded-pill px-3" onclick="loadAllData()">
        <i class="fa-solid fa-rotate-right me-1"></i> Refresh Data
      </button>
    </div>

    <!-- Panel Filter & Pencarian -->
    <div class="main-card mb-4">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold"><i class="fa-solid fa-filter me-1"></i> Pilih Kelas / Rombel:</label>
          <select id="filterKelas" class="form-select form-select-lg" onchange="renderTabel()">
            <option value="SEMUA">-- Tampilkan Semua Kelas --</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold"><i class="fa-solid fa-magnifying-glass me-1"></i> Cari Mata Pelajaran / Hari:</label>
          <input type="text" id="searchKeyword" class="form-control form-control-lg" placeholder="Ketik nama mata pelajaran atau hari..." oninput="renderTabel()">
        </div>
      </div>
    </div>

    <!-- Spinner Loading -->
    <div id="loading" class="text-center py-5">
      <div class="spinner-border text-primary" style="width: 3.5rem; height: 3.5rem;" role="status"></div>
      <p class="mt-3 text-secondary fw-semibold">Mengambil data ujian langsung dari Google Sheets...</p>
    </div>

    <!-- Konten Tabel Data Ujian -->
    <div id="content" class="main-card d-none">
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-primary" id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // ID Spreadsheet Kumpulan PSTS Anda
    const SPREADSHEET_ID = '1HH-8ikCLW2fHHtYZqT1k9ZfPBJcmgQRp0ag0nH7LCGQ';

    let rawUjianData = [];
    let headersList = [];

    // Fungsi Fetch Data CSV dari Tab Google Sheets
    async function fetchCSV(sheetName, hasHeader = true) {
      const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
      const response = await fetch(url);
      if (!response.ok) throw new Error('Gagal mengakses spreadsheet');
      const csvText = await response.text();
      return Papa.parse(csvText, { header: hasHeader, skipEmptyLines: true }).data;
    }

    async function loadAllData() {
      document.getElementById('loading').classList.remove('d-none');
      document.getElementById('content').classList.add('d-none');

      try {
        // 1. Ambil Data Tab 'Pengaturan'
        const configRows = await fetchCSV('Pengaturan', false);
        const config = {};
        configRows.forEach(row => {
          if (row[0]) config[row[0].trim()] = row[1] ? row[1].trim() : '';
        });

        if (config.NAMA_SEKOLAH) document.getElementById('namaSekolah').innerText = config.NAMA_SEKOLAH;
        if (config.JUDUL_HALAMAN) document.getElementById('judulHalaman').innerText = config.JUDUL_HALAMAN;
        if (config.TAHUN_AJARAN) document.getElementById('tahunAjaran').innerText = config.TAHUN_AJARAN;
        if (config.LOGO_URL) {
          const logo = document.getElementById('logoSekolah');
          logo.src = config.LOGO_URL;
          logo.classList.remove('d-none');
        }

        // 2. Ambil Data Tab 'Data_Ujian'
        const ujianRows = await fetchCSV('Data_Ujian', true);
        
        if (ujianRows.length > 0) {
          rawUjianData = ujianRows;
          headersList = Object.keys(ujianRows[0]);

          // Mengisi Pilihan Filter Kelas (Ambil kolom selain Hari, Jam, dan Mata Pelajaran)
          const filterSelect = document.getElementById('filterKelas');
          filterSelect.innerHTML = '<option value="SEMUA">-- Tampilkan Semua Kelas --</option>';
          
          headersList.slice(3).forEach(colName => {
            if (colName && colName.trim() !== '' && colName.trim() !== '-') {
              const opt = document.createElement('option');
              opt.value = colName;
              opt.innerText = `Kelas ${colName}`;
              filterSelect.appendChild(opt);
            }
          });

          renderTabel();
        }

        document.getElementById('loading').classList.add('d-none');
        document.getElementById('content').classList.remove('d-none');

      } catch (error) {
        console.error(error);
        alert('Gagal mengambil data dari Google Spreadsheet. Pastikan pengaturan berbagi file sudah diubah ke "Siapa saja yang memiliki link" (Pelihat)!');
      }
    }

    function renderTabel() {
      const selectedKelas = document.getElementById('filterKelas').value;
      const keyword = document.getElementById('searchKeyword').value.toLowerCase();

      // Filter kolom mana saja yang ingin ditampilkan
      let activeHeaders = [];
      if (selectedKelas === 'SEMUA') {
        activeHeaders = headersList;
      } else {
        // Tampilkan 3 kolom pertama (Hari, Jam, Mapel) + Kolom Kelas yang dipilih
        activeHeaders = [headersList[0], headersList[1], headersList[2], selectedKelas];
      }

      // Render Header Tabel
      let headHtml = '<tr>';
      activeHeaders.forEach(h => {
        headHtml += `<th class="text-nowrap">${h}</th>`;
      });
      headHtml += '</tr>';
      document.getElementById('tableHead').innerHTML = headHtml;

      // Filter Baris Data Berdasarkan Kata Kunci Pencarian
      let bodyHtml = '';
      rawUjianData.forEach(row => {
        const rowText = Object.values(row).join(' ').toLowerCase();
        if (keyword === '' || rowText.includes(keyword)) {
          bodyHtml += '<tr>';
          activeHeaders.forEach(h => {
            const val = row[h] ? row[h].trim() : '-';
            
            // Format URL menjadi Tombol Buka Soal
            if (val.startsWith('http')) {
              bodyHtml += `<td>
                <a href="${val}" target="_blank" class="btn btn-success btn-sm btn-exam text-nowrap">
                  <i class="fa-solid fa-pen-to-square me-1"></i> Buka Soal
                </a>
              </td>`;
            } else if (val === '-' || val === '') {
              bodyHtml += `<td class="text-muted">-</td>`;
            } else {
              bodyHtml += `<td class="fw-medium">${val}</td>`;
            }
          });
          bodyHtml += '</tr>';
        }
      });

      document.getElementById('tableBody').innerHTML = bodyHtml || '<tr><td colspan="100%" class="text-center py-4 text-muted">Data tidak ditemukan.</td></tr>';
    }

    window.onload = loadAllData;
  </script>
</body>
</html>
